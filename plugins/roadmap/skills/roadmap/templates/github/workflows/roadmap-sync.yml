# Scheduled roadmap sync: rewrites the epics' generated sections, keeps one
# "Roadmap drift" issue current (closed when drift is zero), and uploads the
# synced roadmap.json and page. Copy to .github/workflows/ and copy the roadmap
# command to tools/roadmap/. See the roadmap skill's references/enforcement.md.
# The synced roadmap.json is an artifact: review it and commit it by hand.
# The job cannot read Orca, so drift that needs Orca's task list
# (nothing-behind, started-early, unlinked-orca-task) is not in this drift
# issue: sync reports it where Orca runs.
name: Roadmap sync
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  roadmap-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/roadmap/roadmap.py sync roadmap.json --no-orca --write --update-epics
      - run: python3 tools/roadmap/roadmap.py drift-issue roadmap.json --no-orca --apply
      - run: python3 tools/roadmap/roadmap.py render roadmap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap
          path: |
            roadmap.json
            roadmap.html
