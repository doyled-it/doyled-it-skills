name: checks

# Runs the repo gate (scripts/check.sh) on every pull request and on pushes to
# main: the policy tests, the installer test, the printable-parts geometry and
# hook tests, the roadmap command tests, syntax, ShellCheck, and the whitespace
# check. The gate needs Bash, Node 18+, Python 3.11+, and ShellCheck; the
# runner's python3 is new enough, so no extra Python setup is required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run scripts/check.sh
        run: bash scripts/check.sh
